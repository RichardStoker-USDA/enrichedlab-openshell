# Fixed two-node gateway qualification with an existing PostgreSQL Secret.
# Both nodes must be schedulable for the gateway. This profile cannot autoscale.
replicaCount: 2

workload:
  kind: deployment
  protectReplicas: true

server:
  externalDbSecret: openshell-ha-pg
